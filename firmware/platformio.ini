[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Dua slot aplikasi 1,9 MB supaya bisa update firmware lewat WiFi (OTA)
board_build.partitions = min_spiffs.csv
board_build.f_cpu = 240000000L
build_unflags = -Os

build_flags =
    -O2
    -Wno-unused-variable
    -DHTTP_MAX_DATA_WAIT=300
    -DHTTP_MAX_POST_WAIT=2000
    -DHTTP_MAX_SEND_WAIT=2000
    -DHTTP_MAX_CLOSE_WAIT=300
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
lib_deps =
    nrf24/RF24@^1.4.8
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit BusIO@^1.15.0
    h2zero/NimBLE-Arduino@2.5.2
