name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ESP32-TX-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Terbitkan APK ke Releases (link tetap, bisa diunduh tanpa login)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ESP32-TX.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ESP32-TX.apk --title "ESP32 TX APK terbaru" --notes "Build dari commit ${{ github.sha }}" --target ${{ github.sha }}
